name: Windows research portable build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build and run offline DLL tests
        shell: powershell
        run: .\tools\build.ps1 -Target all -RunTests
      - name: Validate portable configuration
        shell: powershell
        run: |
          .\tools\test-portability.ps1
          python -B .\tools\re\test_local_config.py
          if ($LASTEXITCODE -ne 0) { throw 'Python configuration test failed' }
          python -B .\tools\re\check_portable_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source portability audit failed' }
      - name: Package labeled research binaries and corresponding source
        id: research_package
        shell: powershell
        run: |
          $researchVersion = '0.2.3-dev1-visual3-' + $env:GITHUB_SHA.Substring(0, 12)
          .\tools\package-release.ps1 -Version $researchVersion
          "research_version=$researchVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ra3FrameLab-${{ steps.research_package.outputs.research_version }}-windows-x86
          path: |
            build/release/*.zip
            build/release/SHA256SUMS.txt
            build/logs/*.txt
          if-no-files-found: error
